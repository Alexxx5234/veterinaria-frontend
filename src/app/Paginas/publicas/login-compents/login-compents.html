<div class="login-page">

  <div class="login-card">

    <div class="logo-area">

      <div class="logo-icon">
        🐾
      </div>

      <h1>
        Veterinaria
      </h1>

      <p>
        Inicia sesión para gestionar tus mascotas y citas
      </p>

    </div>


    <form
      [formGroup]="loginForm"
      (ngSubmit)="iniciarSesion()"
      class="login-form"
    >


      <!-- CORREO -->
      <div class="form-group">

        <label for="correo">
          Correo electrónico
        </label>

        <input
          id="correo"
          type="email"
          formControlName="correo"
          placeholder="ejemplo@correo.com"
        >

        <small
          class="error"
          *ngIf="
            loginForm.get('correo')?.touched &&
            loginForm.get('correo')?.hasError('required')
          "
        >
          El correo es obligatorio.
        </small>

        <small
          class="error"
          *ngIf="
            loginForm.get('correo')?.touched &&
            loginForm.get('correo')?.hasError('email')
          "
        >
          Ingresa un correo válido.
        </small>

      </div>


      <!-- CONTRASEÑA -->
      <div class="form-group">

        <label for="password">
          Contraseña
        </label>


        <div class="password-container">

          <input
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
          >


          <button
            type="button"
            class="btn-ver-password"
            (click)="cambiarVisibilidadPassword()"
            [attr.aria-label]="
              mostrarPassword
                ? 'Ocultar contraseña'
                : 'Mostrar contraseña'
            "
          >
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>

        </div>


        <small
          class="error"
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.hasError('required')
          "
        >
          La contraseña es obligatoria.
        </small>

      </div>


      <!-- MENSAJE -->
      <div
        class="mensaje-error"
        *ngIf="mensajeError"
      >
        {{ mensajeError }}
      </div>


      <!-- LOGIN -->
      <button
        type="submit"
        class="btn-login"
        [disabled]="cargando"
      >

        <span *ngIf="!cargando">
          Iniciar sesión
        </span>

        <span *ngIf="cargando">
          Ingresando...
        </span>

      </button>


      <!-- REGISTRO -->
      <div class="registro">

        <span>
          ¿No tienes una cuenta?
        </span>

        <a href="/registro">
          Registrarse
        </a>

      </div>

    </form>

  </div>

</div>
